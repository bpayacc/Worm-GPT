name: Build WormGPT Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-port

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install dependencies
        run: npm install

      - name: Debug - liệt kê file
        run: |
          echo "=== Commit ==="
          git log -1 --oneline
          echo "=== Thư mục gốc ==="
          ls -la
          echo "=== Tìm index.html và vite config ==="
          find . -path ./node_modules -prune -o \( -iname "index.html" -o -iname "vite.config.*" \) -print
          echo "=== Script build ==="
          grep -n '"build"' package.json

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WormGPT-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
