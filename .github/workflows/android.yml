name: Build WormGPT Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-port

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install dependencies
        run: |
          npm install
          npm install -D typescript@5.6.3
          if [ ! -d node_modules/@capacitor/android ]; then
            CORE_VER=$(node -p "require('@capacitor/core/package.json').version" 2>/dev/null || echo latest)
            echo "Cài @capacitor/android phiên bản: $CORE_VER"
            npm install @capacitor/android@$CORE_VER
          fi

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WormGPT-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
